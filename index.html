<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OhShifts — Smart Shift Scheduling</title>
    <meta
      name="description"
      content="Lightweight, fast shift scheduling for modern teams. Create schedules, manage employees, and communicate changes — all from one clean interface."
    />
    <link rel="icon" type="image/svg+xml" href="/logo/ohshift-os-monogram.svg" />
    <!-- Paint the theme's page colour before the app (and its CSS) loads, so a
         full page load never flashes the wrong colour (public/theme-init.js;
         colours match --background in globals.css). A blocking, same-origin
         script: the CSP in public/_headers forbids inline ones. -->
    <style>
      html { background: #ffffff; }
      html.dark { background: #191919; color-scheme: dark; }
    </style>
    <script src="/theme-init.js"></script>
  </head>
  <body class="font-sans antialiased overflow-x-hidden bg-background">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OhShifts — Smart Shift Scheduling</title>
    <meta
      name="description"
      content="Lightweight, fast shift scheduling for modern teams. Create schedules, manage employees, and communicate changes — all from one clean interface."
    />
    <link rel="icon" type="image/svg+xml" href="/logo/ohshift-os-monogram.svg" />
    <!-- Paint the theme's page colour before the app (and its CSS) loads, so a
         full page load never flashes the wrong colour. Mirrors next-themes (key "theme",
         default dark, system allowed); --background in globals.css. -->
    <style>
      html { background: #ffffff; }
      html.dark { background: #191919; color-scheme: dark; }
    </style>
    <script>
      try {
        // ohshifts.com and demo.ohshifts.com keep separate storage, so links
        // between them carry the theme as ?theme= (src/lib/demo.ts). Adopt it,
        // then drop it from the address bar before the app reads the URL.
        var url = new URL(location.href);
        var carried = url.searchParams.get("theme");
        if (carried === "light" || carried === "dark" || carried === "system") {
          localStorage.setItem("theme", carried);
          url.searchParams.delete("theme");
          history.replaceState(history.state, "", url.pathname + url.search + url.hash);
        }
        var theme = localStorage.getItem("theme") || "dark";
        var dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>
  <body class="font-sans antialiased overflow-x-hidden bg-background">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

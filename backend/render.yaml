# Render Blueprint — deploy as a separate Web Service
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: ohshift-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: bun install && bun run build
    startCommand: bun run start
    healthCheckPath: /ping
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: FRONTEND_URL
        sync: false

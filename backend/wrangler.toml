# OhShift API — Cloudflare Workers (Hono + Drizzle + D1)

name = "ohshift-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
NODE_ENV = "production"
EMAIL_FROM = "OhShift <notification@ohshifts.com>"
APP_URL = "https://ohshifts.com"

# D1 database. Create once with: bunx wrangler d1 create ohshift
# then paste the printed database_id below.
[[d1_databases]]
binding = "DB"
database_name = "ohshift"
database_id = "ebc12527-207d-47f4-b6b3-e9370840cfc1"
migrations_dir = "drizzle"

# Workers AI binding — powers Ask OhShift (NL shift parse).
# Always remote (even in `wrangler dev`), so local AI calls count toward usage.
[ai]
binding = "AI"
remote = true

# Per-user throttle for the AI endpoints (Workers Rate Limiting; period is 10 or 60s).
[[ratelimits]]
name = "AI_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 15
  period = 60

# Set secrets (do not put them in this file):
#   bunx wrangler secret put AUTH_SECRET
#   bunx wrangler secret put RESEND_API_KEY
#
# APP_URL is the canonical app/CORS origin. FRONTEND_URL is a legacy fallback.
# Local dev reads AUTH_SECRET / FRONTEND_URL from backend/.dev.vars.

# Drain the durable schedule-notification outbox.
[triggers]
crons = ["* * * * *"]

[observability]
enabled = true
head_sampling_rate = 1
